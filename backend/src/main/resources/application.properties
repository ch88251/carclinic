spring.application.name=carclinic
server.port=8080
logging.level.root=DEBUG

# Database Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5432/carclinic
spring.datasource.username=carclinic
spring.datasource.password=carclinic
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop

# Security Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/carclinic

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
